services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
    environment:
      POSTGRES_DB: ghosttalk
      POSTGRES_USER: ghosttalk
      POSTGRES_PASSWORD: ghosttalk
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/migrations/002_transcripts_and_insights.sql:/docker-entrypoint-initdb.d/002_transcripts_and_insights.sql:ro
      - ./db/migrations/003_media_started_at.sql:/docker-entrypoint-initdb.d/003_media_started_at.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghosttalk -d ghosttalk"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://ghosttalk:ghosttalk@db:5432/ghosttalk?sslmode=disable
      ADDR: :8080
      WHISPER_URL: http://whisper:8000
      TTS_URL: http://tts:8000
      ANONYMOUS_AUDIO_WORKER_URL: http://anonymous-audio-worker:8080
      ANALYSIS_WORKER_URL: http://analysis-worker:8080
      MEDIA_TOPOLOGY: "${MEDIA_TOPOLOGY:-single}"
      INTERNAL_WORKER_TOKEN: "${INTERNAL_WORKER_TOKEN:-}"
      TRANSCRIPT_RETENTION: "${TRANSCRIPT_RETENTION:-720h}"
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
    depends_on:
      db:
        condition: service_healthy
      whisper:
        condition: service_started
      tts:
        condition: service_started
      anonymous-audio-worker:
        condition: service_started
    restart: unless-stopped

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    environment:
      WHISPER_MODEL: Systran/faster-whisper-small
    restart: unless-stopped

  tts:
    build: ./tts
    restart: unless-stopped

  anonymous-audio-worker:
    build: ./anonymous-audio-worker
    environment:
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      DATABASE_URL: postgres://ghosttalk:ghosttalk@db:5432/ghosttalk?sslmode=disable
      STT_PROVIDER: faster-whisper
      STT_MODEL: small
      TTS_PROVIDER: piper
      LOG_LEVEL: info
      LOG_TRANSCRIPTS: "false"
      SAVE_AUDIO_SAMPLES: "false"
      INTERNAL_WORKER_TOKEN: "${INTERNAL_WORKER_TOKEN:-}"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  analysis-worker:
    build: ./analysis-worker
    environment:
      BACKEND_URL: http://backend:8080
      INTERNAL_WORKER_TOKEN: "${INTERNAL_WORKER_TOKEN:-}"
      ANALYSIS_URL: "${ANALYSIS_URL:-}"
      ANALYSIS_API_KEY: "${ANALYSIS_API_KEY:-}"
      ANALYSIS_MODEL: "${ANALYSIS_MODEL:-}"
      ANALYSIS_POLL_SECONDS: "${ANALYSIS_POLL_SECONDS:-5}"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  media-worker:
    build: ./media-worker
    environment:
      BACKEND_URL: http://backend:8080
      INTERNAL_WORKER_TOKEN: "${INTERNAL_WORKER_TOKEN:-}"
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      MEDIA_TOPOLOGY: "${MEDIA_TOPOLOGY:-single}"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:master
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE: ""
    depends_on:
      - backend
      - livekit
    environment:
      ENABLE_TLS: "${ENABLE_TLS:-false}"
      SERVER_NAME: "${SERVER_NAME:-_}"
      LIVEKIT_SERVER_NAME: "${LIVEKIT_SERVER_NAME:-}"
      CERTBOT_WWW_ROOT: /var/www/certbot
      TLS_CERT_PATH_CONTAINER: "${TLS_CERT_PATH_CONTAINER:-/etc/nginx/tls/fullchain.pem}"
      TLS_KEY_PATH_CONTAINER: "${TLS_KEY_PATH_CONTAINER:-/etc/nginx/tls/privkey.pem}"
      LIVEKIT_TLS_CERT_PATH_CONTAINER: "${LIVEKIT_TLS_CERT_PATH_CONTAINER:-/etc/nginx/tls/livekit/fullchain.pem}"
      LIVEKIT_TLS_KEY_PATH_CONTAINER: "${LIVEKIT_TLS_KEY_PATH_CONTAINER:-/etc/nginx/tls/livekit/privkey.pem}"
      LIVEKIT_UPSTREAM: "${LIVEKIT_UPSTREAM:-http://livekit:7880}"
      CSP_CONNECT_SRC: "${CSP_CONNECT_SRC:-'self'}"
    ports:
      - "${HOST_FRONTEND_HTTP_PORT:-80}:80"
      - "${HOST_FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - "${TLS_CERTS_DIR:-./certs}:/etc/nginx/tls:ro"
      - "${CERTBOT_WWW_PATH:-./certbot-www}:/var/www/certbot"
    restart: unless-stopped

volumes:
  pgdata:
